version: '3.8'

services:
  gas-controller:
    build: .
    container_name: arduino_gas_controller
    
    # Forward the Flask port from inside the container to your local machine
    ports:
      - "5001:5001"
    
    # Map the serial device (Linux only)
    # On Linux, /dev/ttyACM0 or /dev/ttyUSB0 is common.
    # Change this if your Arduino is on a different port.
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    
    # Restart if the container fails
    restart: always

    # Map current directory for persistent CSV data (GasMapping.csv)
    volumes:
      - .:/app
