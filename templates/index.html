<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Gas Control</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f8f9fa; color: #212529; }
        .container { max-width: 360px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1a1a1a; font-size: 18px; margin-bottom: 15px; font-weight: 600; }
        .connection-status { 
            text-align: center; 
            margin-bottom: 15px; 
            padding: 6px;
            font-size: 12px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f3f5;
        }
        .status-dot { 
            height: 9px; 
            width: 9px; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 8px; 
            transition: background-color 0.3s;
        }
        .status-connected-text { color: #28a745; }
        .status-disconnected-text { color: #dc3545; }
        .status-connected-dot { background-color: #28a745; box-shadow: 0 0 8px rgba(40, 167, 69, 0.4); }
        .status-disconnected-dot { background-color: #dc3545; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: #495057; }
        select, input { width: 100%; padding: 8px; font-size: 14px; border-radius: 8px; border: 1px solid #dee2e6; background-color: #fff; box-sizing: border-box; transition: border-color 0.2s; }
        select:focus, input:focus { outline: none; border-color: #007bff; }
        
        button { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        #purgeBtn { background-color: #007bff; color: white; }
        #purgeBtn:hover { background-color: #0069d9; transform: translateY(-1px); }
        #purgeBtn:disabled { background-color: #b8daff; cursor: not-allowed; }
        
        .status-area { margin-top: 20px; padding: 8px 12px; background-color: #f8f9fa; border-radius: 6px; font-size: 12px; text-align: center; border: 1px solid #eee; min-height: 20px; transition: all 0.3s; }
        .error { color: #dc3545; background-color: #fff5f5; border-color: #ffc9c9; }
        .success { color: #28a745; background-color: #f6fff6; border-color: #c3e6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gas Controller</h1>
        
        <div id="connectionBanner" class="connection-status">
            <span class="status-dot status-disconnected-dot" id="statusDot"></span>
            <span id="statusText" class="status-disconnected-text">Searching for Controller...</span>
        </div>

        <div class="form-group">
            <label for="gasSelection">Target Gas</label>
            <select id="gasSelection">
                {% for gas in gases %}
                <option value="{{ gas.Gas }}">{{ gas.Gas }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="purgeTime">Purge Duration (sec)</label>
            <input type="number" id="purgeTime" min="1" max="600" value="10">
        </div>

        <button id="purgeBtn" disabled>PURGE</button>

        <div class="status-area" id="statusArea">
            Connecting...
        </div>
    </div>

    <script>
        const statusArea = document.getElementById('statusArea');
        const purgeBtn = document.getElementById('purgeBtn');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const connectionBanner = document.getElementById('connectionBanner');
        const gasSelection = document.getElementById('gasSelection');
        const purgeTimeInput = document.getElementById('purgeTime');

        function updateStatus() {
            fetch('/status')
            .then(res => res.json())
            .then(data => {
                if (data.connected) {
                    statusText.innerText = 'Connected: ' + data.port;
                    statusText.className = 'status-connected-text';
                    statusDot.className = 'status-dot status-connected-dot';
                    purgeBtn.disabled = false;
                    if (statusArea.innerText === 'Connecting...' || statusArea.innerText === 'Initializing serial scan...') {
                        statusArea.innerText = 'Ready';
                    }
                } else {
                    statusText.innerText = 'Disconnected';
                    statusText.className = 'status-disconnected-text';
                    statusDot.className = 'status-dot status-disconnected-dot';
                    purgeBtn.disabled = true;
                    statusArea.innerText = 'Initializing serial scan...';
                }
            })
            .catch(err => {
                statusText.innerText = 'Server Offline';
                statusText.className = 'status-disconnected-text';
            });
        }

        setInterval(updateStatus, 3000);
        updateStatus();

        purgeBtn.addEventListener('click', () => {
            const gas = gasSelection.value;
            const time = purgeTimeInput.value;
            
            purgeBtn.disabled = true;
            statusArea.innerText = 'Processing purge...';
            statusArea.className = 'status-area';
            
            fetch('/purge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gas, time })
            })
            .then(res => res.json())
            .then(data => {
                statusArea.innerText = data.message;
                statusArea.className = 'status-area ' + data.status;
                setTimeout(() => { 
                    if (statusText.innerText.includes('Connected')) purgeBtn.disabled = false;
                }, 1000);
            })
            .catch(err => {
                statusArea.innerText = 'Communication failed';
                statusArea.className = 'status-area error';
                purgeBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
